apiVersion: apps/v1
kind: Deployment
metadata:
  name: netfusion-frontend
  namespace: default
  labels:
    app.kubernetes.io/name: netfusion-frontend
    app.kubernetes.io/part-of: netfusion
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netfusion-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netfusion-frontend
    spec:
      containers:
        - name: frontend
          image: netfusion/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: netfusion-frontend
  namespace: default
  labels:
    app.kubernetes.io/name: netfusion-frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app.kubernetes.io/name: netfusion-frontend
