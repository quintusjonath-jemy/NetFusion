version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netfusion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: netfusion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../backend/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d netfusion"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: netfusion-backend
    restart: unless-stopped
    # Use host network mode and NET_ADMIN to bind to physical interfaces and inspect Linux MPTCP
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DB_DRIVER: "postgres"
      DATABASE_URL: "postgres://postgres:postgrespassword@127.0.0.1:5432/netfusion?sslmode=disable"
      SIMULATION_MODE: "false"
      LOG_LEVEL: "INFO"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    container_name: netfusion-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
